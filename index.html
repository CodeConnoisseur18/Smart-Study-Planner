<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Study Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="planner">
        <h1>My Study Planner</h1>
        <p>Small steps, big progress!</p>
        <p id="taskCounter">Tasks completed: 0/0</p>
        <div class="filters">
            <button id="allFilter">All</button>
            <button id="pendingFilter">Pending</button>
            <button id="completedFilter">Completed</button>
        </div>
        <div class="task-input">
            <input id="taskInput" type="text" placeholder="Enter a study task....">
            <button id="addButton">Add</button>
        </div>
        <ul id="taskList"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
